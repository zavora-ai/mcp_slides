[package]
name = "slides-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
description = "Slides MCP Server — create, edit, and export PowerPoint (.pptx) presentations for AI agents"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp_slides"
homepage = "https://zavora.ai"
keywords = ["mcp", "pptx", "powerpoint", "presentation", "ai"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = [".cargo/"]

[dependencies]
# schemars is implied by "server" but named here because the code refers to
# rmcp::schemars directly.
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros", "schemars"] }
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
zavora-slide = "0.1"
zavora-slide-oxml = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
zavora-slide-opc = "0.1"

[workspace]
