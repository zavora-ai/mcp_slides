[package]
name = "slides-mcp-server"
version = "0.1.0"
edition = "2021"
description = "Slides MCP Server — create, edit, and export PowerPoint (.pptx) presentations for AI agents"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/slides-mcp"
homepage = "https://zavora.ai"
keywords = ["mcp", "pptx", "powerpoint", "presentation", "ai"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = [".cargo/"]

[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
zavora-slide = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
zavora-slide-opc = "0.1"

[workspace]
